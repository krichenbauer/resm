name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves project sites from `/<repository>/`.
      RESM_BASE_PATH: /${{ github.event.repository.name }}/
    defaults:
      run:
        # Run every step in the same Nix development shell used locally.
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: End-to-end tests (Chromium, Firefox)
        run: pnpm test:e2e --project=chromium --project=firefox
      # WebKit from Nix found no graphics driver on this runner and closed
      # itself as soon as a page was opened. The flake now points it to
      # Mesa's software renderer. Until that is confirmed here, the WebKit
      # tests are reported but do not decide whether the build passes. The
      # first of the two steps logs what the browser itself says.
      - name: WebKit diagnostics (informational)
        continue-on-error: true
        env:
          DEBUG: pw:browser
        run: pnpm test:e2e --project=webkit shell.spec.ts
      - name: End-to-end tests (WebKit, informational)
        continue-on-error: true
        run: pnpm test:e2e --project=webkit
      - name: Upload traces of failed browser tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
